name = "json-schema-dev"
# main is handled by the generated .output/server/wrangler.json
compatibility_date = "2025-11-15"
compatibility_flags = ["nodejs_compat", "no_nodejs_compat_v2"]

[build]
command = "pnpm run build"

# Assets binding for static files
[assets]
binding = "ASSETS"
directory = ".output/public"

# Environment variables
[vars]
NITRO_PRESET = "cloudflare-module"
ENVIRONMENT = "production"

# Note: Single production deployment
# - Worker name: json-schema-dev (clean, no suffix)
# - Environment variables set during build via ENVIRONMENT=production
# - Secrets managed via: pnpm wrangler secret put <NAME>
